plugins { id 'com.android.application' }
android {
    namespace 'com.bonika.modmenu'
    compileSdk 34
    defaultConfig {
        applicationId "com.bonika.modmenu"
        minSdk 21; targetSdk 34; versionCode 1; versionName "2.0-pro"
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }
    externalNativeBuild { cmake { path "src/main/cpp/CMakeLists.txt"; version "3.22.1" } }
}
