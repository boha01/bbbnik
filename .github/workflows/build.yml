name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK and CMake
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Dobby library
        run: |
          git clone --depth 1 https://github.com/jmpews/Dobby.git /tmp/Dobby
          for ABI in arm64-v8a armeabi-v7a; do
            mkdir -p /tmp/dobby-build-$ABI
            cmake -S /tmp/Dobby -B /tmp/dobby-build-$ABI \
              -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=$ABI \
              -DANDROID_PLATFORM=android-21 \
              -DCMAKE_BUILD_TYPE=Release
            cmake --build /tmp/dobby-build-$ABI -j"$(nproc)"
            mkdir -p "app/src/main/cpp/dobby/$ABI"
            cp "$(find /tmp/dobby-build-$ABI -name libdobby.a | head -1)" "app/src/main/cpp/dobby/$ABI/libdobby.a"
            ls -lh "app/src/main/cpp/dobby/$ABI/libdobby.a"
          done
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ModMenuPro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
