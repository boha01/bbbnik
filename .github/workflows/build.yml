name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK and CMake
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Create Dobby stub library
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/26.1.10909125"
          LLVM="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cat > /tmp/dobby_stub.c <<'EOF'
          int DobbyHook(void *address, void *replace_call, void **origin_call) {
              if (origin_call) *origin_call = 0;
              return -1;
          }
          EOF
          mkdir -p app/src/main/cpp/dobby/arm64-v8a app/src/main/cpp/dobby/armeabi-v7a
          "$LLVM/clang" --target=aarch64-linux-android21 -c /tmp/dobby_stub.c -o /tmp/dobby64.o
          "$LLVM/llvm-ar" rcs app/src/main/cpp/dobby/arm64-v8a/libdobby.a /tmp/dobby64.o
          "$LLVM/clang" --target=armv7a-linux-androideabi21 -c /tmp/dobby_stub.c -o /tmp/dobby32.o
          "$LLVM/llvm-ar" rcs app/src/main/cpp/dobby/armeabi-v7a/libdobby.a /tmp/dobby32.o
          ls -lh app/src/main/cpp/dobby/*/libdobby.a

      # Retry loop: the 2026-11-21 failure was Gradle failing to DOWNLOAD the
      # Android Gradle Plugin's own dependencies (kotlin-stdlib, gson, asm...)
      # from Maven Central — a network/repository glitch before any code is
      # compiled. Retrying with --refresh-dependencies rides out that glitch.
      - name: Build debug APK (with retries)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/26.1.10909125"
          ok=0
          for i in 1 2 3; do
            echo "=== Build attempt $i ==="
            if gradle assembleDebug --stacktrace --refresh-dependencies; then ok=1; break; fi
            echo "Attempt $i failed — waiting 30s and retrying"
            gradle --stop || true
            sleep 30
          done
          if [ "$ok" != "1" ]; then echo "All build attempts failed"; exit 1; fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ModMenuPro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
